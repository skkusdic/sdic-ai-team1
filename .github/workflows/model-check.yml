name: Model Lock Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Only claude-haiku-4-5 allowed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find non-haiku Claude model references
        run: |
          set -e
          hits=$(grep -rEn 'claude-[a-zA-Z0-9_-]+' \
                  --include='*.py' \
                  --include='*.md' \
                  --exclude-dir='.git' \
                  --exclude-dir='.github' \
                  --exclude-dir='_before_merge' \
                  . || true)
          if [ -z "$hits" ]; then
            echo "OK: no claude-* references found."
            exit 0
          fi
          forbidden=$(printf '%s\n' "$hits" | grep -vE 'claude-haiku-4-5' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Non-haiku Claude model detected. Only claude-haiku-4-5 is allowed (학회 비용 정책)."
            echo "$forbidden"
            exit 1
          fi
          echo "OK: only claude-haiku-4-5 references found."
